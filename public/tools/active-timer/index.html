<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Таймер · Школа актива</title><style>
*{box-sizing:border-box}body{margin:0;background:#0645ce;color:white;font-family:Arial,sans-serif;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#2675ff,transparent 55%),#0645ce}main{max-width:1400px;margin:auto;padding:28px 40px;text-align:center}header{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:20px}h1{font-size:28px;margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ffffff60;border-radius:14px;padding:12px 20px;background:#ffffff17;color:white;font-weight:bold}button:hover{background:#ffffff30}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffdf68;outline-offset:3px}.primary{background:#f42144;border:none;min-width:200px}.primary:hover{background:#d8183a}#title{font-size:clamp(25px,3vw,44px);margin:30px 0 0}#clock{font-size:clamp(100px,21vw,280px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.04em}#status{min-height:44px;font-size:28px;font-weight:bold}.bar{height:10px;background:#ffffff26;border-radius:10px;margin:20px 0 30px;overflow:hidden}.bar i{display:block;height:100%;background:white;width:100%}.actions,.presets,.custom{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}select,input{background:#0638a4;color:white;border:1px solid #ffffff70;padding:10px;border-radius:10px}select{max-width:100%;width:420px}input{width:90px}label{display:flex;gap:8px;align-items:center}small{opacity:.8}.warning #clock{color:#ffdf68}.finished #clock{color:#fff}.finished #status{background:#f42144;border-radius:14px;padding:12px}.stage .setup,.stage header h1,.stage footer{display:none}.stage #clock{font-size:clamp(130px,24vw,330px)}footer{margin-top:25px;font-size:14px;opacity:.8}@media(max-height:720px){main{padding:15px 30px}#title{margin-top:15px}#clock{font-size:24vh}.stage #clock{font-size:38vh}.bar{margin:10px 0}.actions,.presets,.custom{margin:10px 0}footer{margin-top:12px}}
</style><main><header><h1>ШКОЛА АКТИВА</h1><div><button id="stage">Режим показа</button> <button id="full">На весь экран</button></div></header><h2 id="title">Работа в команде</h2><div id="clock" role="timer" aria-label="Осталось времени">05:00</div><div id="status" aria-live="polite">Готовы начать?</div><div class="bar"><i id="progress"></i></div><div class="actions"><button class="primary" id="start">Старт</button><button id="reset">Сначала</button><button id="extra">+1 минута</button><button id="sound" aria-pressed="true">Звук: вкл.</button></div><section class="setup"><div class="presets" id="presets"></div><div class="custom"><label>Задание <select id="activity"><option>Работа в команде</option><option>Подготовка выступления</option><option>Выступление с поворотом</option><option>Фото по карточке</option><option>Организуй свой день</option><option>Представь себя</option><option>Октябрьское дело</option><option>Мой следующий шаг</option></select></label><label>Мин <input id="minutes" type="number" min="0" max="120" value="5"></label><label>Сек <input id="seconds" type="number" min="0" max="59" value="0"></label><button id="apply">Установить</button></div><small>«Выступление с поворотом»: 1 минута, автоматическая пауза через 30 секунд.</small></section><footer>Кемский муниципальный округ<br><br>Пробел — старт / пауза · R — сначала · F — полный экран · H — режим показа</footer></main><script>
const el=id=>document.getElementById(id);let duration=300000,remaining=duration,running=false,deadline=0,sound=true,audio=null,turnMode=false,turnDone=false,turnPending=false;
function beep(){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();[0,.25,.5].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=660;g.gain.setValueAtTime(.08,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.18);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.2)})}catch(e){}}
function render(){let s=Math.ceil(remaining/1000);el('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el('progress').style.width=Math.max(0,remaining/duration*100)+'%';document.body.classList.toggle('warning',remaining>0&&remaining<=30000);document.body.classList.toggle('finished',remaining===0);el('start').textContent=running?'Пауза':turnPending?'Продолжить после поворота':remaining===0?'Повторить':remaining===duration?'Старт':'Продолжить';}
function set(ms){running=false;duration=remaining=ms;turnDone=turnPending=false;el('status').textContent='Готовы начать?';render()}
function toggle(){if(running){remaining=Math.max(0,deadline-performance.now());running=false;el('status').textContent='Пауза'}else{if(remaining===0)set(duration);turnPending=false;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}deadline=performance.now()+remaining;running=true;el('status').textContent='Время пошло'}render()}
function tick(){if(!running)return;const next=Math.max(0,deadline-performance.now());if(turnMode&&!turnDone&&next<=30000){remaining=30000;running=false;turnDone=turnPending=true;el('status').textContent='ПОВОРОТ! Послушайте новое условие';beep()}else{remaining=next;if(!remaining){running=false;el('status').textContent='ВРЕМЯ! Завершайте мысль';beep()}}render()}
setInterval(tick,100);el('start').onclick=toggle;el('reset').onclick=()=>set(duration);el('extra').onclick=()=>{if(running)remaining=Math.max(0,deadline-performance.now());remaining+=60000;duration+=60000;if(running)deadline=performance.now()+remaining;else if(!turnPending)el('status').textContent='Добавлена 1 минута';render()};el('sound').onclick=()=>{sound=!sound;el('sound').textContent='Звук: '+(sound?'вкл.':'выкл.');el('sound').setAttribute('aria-pressed',sound)};
[20,30,60,180,300,480,600,900].forEach(s=>{let b=document.createElement('button');b.textContent=s<60?s+' сек.':s/60+' мин.';b.onclick=()=>{turnMode=false;set(s*1000);el('minutes').value=Math.floor(s/60);el('seconds').value=s%60};el('presets').appendChild(b)});
el('activity').onchange=()=>{el('title').textContent=el('activity').value;turnMode=el('activity').value==='Выступление с поворотом';const d={'Подготовка выступления':180,'Выступление с поворотом':60,'Фото по карточке':480,'Организуй свой день':540,'Представь себя':60,'Октябрьское дело':900,'Мой следующий шаг':60};const s=d[el('activity').value]||300;set(s*1000);el('minutes').value=Math.floor(s/60);el('seconds').value=s%60};el('apply').onclick=()=>{const m=Number(el('minutes').value),s=Number(el('seconds').value);if(!Number.isInteger(m)||!Number.isInteger(s)||m<0||m>120||s<0||s>59||m*60+s===0){el('status').textContent='Укажите от 1 секунды до 120 минут 59 секунд';return}turnMode=false;set((m*60+s)*1000)};
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){el('status').textContent='Для полного экрана нажмите F11'}}el('full').onclick=full;el('stage').onclick=()=>{document.body.classList.toggle('stage');el('stage').textContent=document.body.classList.contains('stage')?'Настройки':'Режим показа'};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='KeyR')set(duration);if(e.code==='KeyF')full();if(e.code==='KeyH')el('stage').click()});render();
</script></html>
