function toCol(s){return [...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)}function colName(n){let s='';while(n>0){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}

{title:'Формула, которая думает за нас',group:'theory',minutes:2,render:()=>'<div class="eyebrow">Два урока · от исследования к практике</div><div class="hero"><div><h1>Одна формула.<br><em>Сотни вычислений.</em></h1><p>Как поручить Excel расчёты<br>и сохранить контроль над результатом?</p><div class="tags"><span class="tag">Формулы</span><span class="tag">Ссылки</span><span class="tag">Диаграммы</span></div><div class="row spaced"><button class="primary" data-go="1">Начать исследование →</button><button data-go="12">К практике</button></div><p class="small muted">Урок 1 — разбираемся и проверяем гипотезы.<br>Урок 2 — создаём работающую книгу Excel.</p></div><div class="hero-art"><div class="hero-sheet"><div class="sheetbar"><span>fx</span><span class="formula">=B2*C2</span></div>'+grid([['Статья','Кол-во','Цена','Сумма'],['Поездка',20,150,3000],['Билеты',20,250,5000],['Питание',20,350,7000]],{compact:true})+'</div><div class="float"><div class="small">Изменили данные</div><div class="formula accent spaced">Результат обновился ↗</div></div></div></div>'},
{title:'Что хранится в ячейке?',group:'theory',minutes:3,render:()=>head('01 · Данные и формулы','Что хранится в ячейке?','Нажмите на ячейку. Сравните её содержимое и то, что видно в таблице.')+'<div class="grid wide"><div><div class="sheetbar"><b id="cellName">D2</b><span>fx</span><span class="formula" id="cellFormula">=B2*C2</span></div>'+grid([['Статья','Кол-во','Цена','Сумма'],['Транспорт',20,150,3000],['Экскурсия',20,250,5000],['Питание',20,350,7000]],{click:true,selected:'D2'})+'<p class="small muted spaced">Адрес D2: столбец D, строка 2. Имена столбцов в формулах — латинские.</p></div><div class="panel stack"><h3>Исследуйте расчёт</h3><div class="controlgrid" style="grid-template-columns:1fr 1fr"><label>Количество<input id="qty" type="number" min="0" max="10000" value="20"></label><label>Цена, ₽<input id="price" type="number" min="0" max="100000" value="150"></label></div><div class="big accent" id="product">3 000 ₽</div><p>Формула начинается со знака <b>=</b>.<br><span class="formula">*</span> — умножение, <span class="formula">/</span> — деление.</p><p class="small muted">Измените исходное число и посмотрите на ячейку D2.</p></div></div>'},
{title:'Диапазоны и функции',group:'theory',minutes:4,render:()=>head('02 · Сумма и среднее','Один диапазон — четыре вопроса','Двигайте ползунки и объясняйте, как изменяются результаты.')+'<div class="grid"><div class="panel"><h3>Четыре числовые ячейки A1:D1</h3><div class="stack">'+[6,7,5,10].map((v,i)=>'<label><span>'+String.fromCharCode(65+i)+'1 = <b id="v'+i+'">'+v+'</b></span><input type="range" id="rng'+i+'" min="0" max="20" value="'+v+'"></label>').join('')+'</div></div><div class="stack"><div class="panel"><div class="row between"><span class="formula">=СУММ(A1:D1)</span><b class="big accent" id="sumVal">28</b></div><p class="small muted">Двоеточие задаёт диапазон от A1 до D1 включительно.</p></div><div class="panel"><div class="row between"><span class="formula">=СРЗНАЧ(A1:D1)</span><b class="big accent" id="avgVal">7</b></div><p class="small muted">Сумма ÷ количество числовых значений.</p></div><div class="row panel between"><span>МИН: <b id="minVal">5</b></span><span>МАКС: <b id="maxVal">10</b></span></div><p class="small muted">Ноль участвует в среднем; пустая ячейка и текст в ссылочном диапазоне не учитываются функцией СРЗНАЧ.</p></div></div>'},
{title:'Обратная задача о среднем',group:'theory',minutes:3,render:()=>head('03 · От результата к данным','Среднее известно. Что можно найти?','Четыре числовые ячейки A1:D1. Среднее равно 7, а D1 = 10.')+'<div class="grid"><div class="stack">'+grid([['?','?','?',10]])+'<div class="panel"><p>Найдите сумму <span class="formula">A1:C1</span>, не подбирая каждое число.</p>'+chk('inverse','18','Сначала восстановите сумму четырёх чисел: 7 × 4.','Сумма всех четырёх = 7 × 4 = 28. Тогда A1:C1 = 28 − 10 = 18.')+'</div></div><div class="panel dark"><h3>Три шага рассуждения</h3><div class="stack"><p>1. Определите, сколько чисел участвовало в среднем.</p>'+box('Общая сумма = среднее × 4')+'<p>2. Уберите известную часть.</p>'+box('Нужная сумма = 7 × 4 − 10')+'<p class="small" style="color:#d1e5d4">Отдельные A1, B1 и C1 определить нельзя: одной и той же сумме соответствуют разные тройки чисел.</p></div></div></div>'},
{title:'Четыре вида ссылок',group:'theory',minutes:4,render:()=>head('04 · Адресация','Знак $ фиксирует часть адреса','Сравним ссылки при копировании на один столбец вправо и одну строку вниз.')+'<div class="grid wide"><div class="panel"><table class="locktable"><tr><th>Исходная ссылка</th><th>Что фиксируется</th><th>После копирования</th></tr><tr><td class="formula">B2</td><td>Ничего</td><td class="formula">C3</td></tr><tr><td class="formula"><span class="lock">$</span>B<span class="lock">$</span>2</td><td>Столбец и строка</td><td class="formula">$B$2</td></tr><tr><td class="formula"><span class="lock">$</span>B2</td><td>Столбец B</td><td class="formula">$B3</td></tr><tr><td class="formula">B<span class="lock">$</span>2</td><td>Строка 2</td><td class="formula">C$2</td></tr></table></div><div class="panel soft stack"><h3>Где это пригодится?</h3><p>Стоимость каждой строки:</p>'+box('=B2*C2')+'<p>Один общий резерв в H2:</p>'+box('=D2*(1+$H$2)')+'<p class="small muted">В Excel при редактировании формулы выделите ссылку и нажимайте F4. На некоторых ноутбуках — Fn + F4.</p></div></div>'},
{title:'Лаборатория копирования',group:'theory',minutes:5,render:()=>head('05 · Исследование','Куда сдвинется ссылка?','Меняйте смещение и тип фиксации. Сначала предскажите результат, затем сравните.')+'<div class="grid wide copylab"><div class="panel"><div class="row between"><span class="tag">Копируем из D3</span><span id="copyTarget" class="tag">в E2</span></div><div class="controlgrid spaced" style="grid-template-columns:1fr 1fr"><label><span>Столбцы: <b id="dxLabel">+1</b></span><input id="dx" type="range" min="-2" max="2" value="1"></label><label><span>Строки: <b id="dyLabel">−1</b></span><input id="dy" type="range" min="-2" max="2" value="-1"></label></div><div class="controlgrid spaced" style="grid-template-columns:1fr 1fr"><label>Первая ссылка<select id="ref1"><option>B3</option><option selected>$B3</option><option>B$3</option><option>$B$3</option></select></label><label>Вторая ссылка<select id="ref2"><option>C2</option><option>$C2</option><option selected>C$2</option><option>$C$2</option></select></label></div><div class="spaced"><span class="small muted">До копирования</span>'+box('=$B3+C$2','large').replace('<div class="codebox','<div id="copyBefore" class="codebox')+'</div><div class="spaced"><span class="small muted">После копирования</span><div class="codebox formula large" id="copyAfter">=$B2+D$2</div></div></div><div class="stack"><div id="copyGrid">'+grid(copyData,{compact:true,selected:'E2'})+'</div><p id="copyExplain" class="hint">Сдвиг: +1 столбец, −1 строка. У $B3 меняется только строка; у C$2 — только столбец.</p><p class="small muted">Здесь исследуем адреса. Если ссылка пришла в ячейку с формулой или в пустую ячейку, числовой результат отдельно не вычисляется.</p></div></div>'},
{title:'Пример по шагам',group:'theory',minutes:4,render:()=>head('06 · Разобранный пример','Сначала новая формула. Потом число.','Из D3 копируем формулу =$B3+C$2 в E2. Нажимайте «Следующий шаг».')+'<div class="grid wide"><div>'+grid(copyData,{compact:true,selected:'D3'})+'</div><div class="panel stack"><div class="tag" id="workedTag">Шаг 1 из 4</div><h3 id="workedTitle">Найдите смещение</h3><div id="workedText">D → E: +1 столбец.<br>3 → 2: −1 строка.</div><div class="codebox formula large" id="workedFormula">Δстолбца = +1<br>Δстроки = −1</div><div class="row"><button id="workedPrev">←</button><button id="workedNext" class="primary">Следующий шаг →</button></div><p class="small muted">Не вычисляйте исходную формулу: после копирования она может обращаться к другим данным.</p></div></div>'},
{title:'Поиск ячейки назначения',group:'theory',minutes:3,render:()=>head('07 · Обратное копирование','В какую ячейку попала формула?','Из D2 формулу =B$3+$C2 скопировали в одну из E1:E4. Получилось 16.')+'<div class="grid"><div>'+grid([[2,4,6,8,null],[3,5,7,'=B$3+$C2',null],[4,6,8,10,null],[5,7,9,11,null]],{compact:true})+'<p class="small muted spaced">Номер строки результата — ваш ответ.</p></div><div class="panel"><div class="choice" id="targetChoices">'+[1,2,3,4].map(i=>'<button data-target="'+i+'">E'+i+'<span id="tv'+i+'" style="float:right">?</span></button>').join('')+'</div><div id="targetFeedback" class="feedback" aria-live="polite"></div><button id="targetReveal">Показать все преобразования</button><div id="targetDetails" class="small muted spaced"></div></div></div>'},
{title:'Диаграмма как условие',group:'theory',minutes:4,render:()=>head('08 · Таблица ↔ диаграмма','Как получить три равных сектора?','В C1 находится число x. Диаграмма строится по значениям A2:C2.')+'<div class="grid"><div class="stack">'+grid([[8,4,'x'],['=2*(A1-C1)','=(A1+B1)/3','=C1-2']],{compact:true})+'<div class="panel"><label><span>C1 = <b id="chartXLabel">3</b></span><input type="range" id="chartX" min="2" max="8" step="1" value="3"></label><p class="small muted">Сравните сектор и число. В этой задаче значения неотрицательны.</p><div class="feedback" id="chartFeedback" aria-live="polite"></div></div></div><div class="panel"><div class="chartlayout"><div class="donut" id="donut"></div><div class="chartlegend" id="chartLegend"></div></div><div class="stats"><div class="stat">A2<b id="ca">10</b></div><div class="stat">B2<b id="cb">4</b></div><div class="stat">C2<b id="cc">1</b></div></div><p class="small muted spaced">Равные сектора означают равные значения. B2 уже известно: (8 + 4) / 3 = 4.</p></div></div>'},
{title:'Единицы и итоговые строки',group:'theory',minutes:3,render:()=>head('09 · Прикладная задача','Верный расчёт начинается с единиц','Выручка указана в тысячах рублей, расходы — в рублях.')+'<div class="grid"><div class="panel"><table class="locktable"><tr><th>Месяц</th><th>Выручка, тыс. ₽</th></tr><tr><td>Сентябрь</td><td>42</td></tr><tr><td>Октябрь</td><td>38</td></tr><tr><td>Ноябрь</td><td>50</td></tr><tr><td>Декабрь</td><td>45</td></tr></table><p class="spaced">Расходы за четыре месяца: <b>105 000 ₽</b>.</p></div><div class="panel stack"><h3>Найдите результат в рублях</h3>'+box('=СУММ(B2:B5)*1000-D2')+chk('profit','70000','Сложите 42 + 38 + 50 + 45, затем переведите тысячи рублей в рубли.','175 × 1000 − 105 000 = 70 000 ₽.','Результат, ₽')+'<p class="small muted">Если в таблице есть строка «Итого», не включайте одновременно её и исходные строки в сумму.</p></div></div>'},
{title:'Найдите ошибку',group:'theory',minutes:3,render:()=>head('10 · Отладка','Почему при протягивании резерв исчез?','Общий резерв 10% хранится в H2. Формула в E2: =D2*(1+H2).')+'<div class="grid"><div class="panel dark stack"><h3>После копирования вниз</h3>'+box('E3: =D3*(1+H3)')+'<p>H3 пустая. В этом расчёте она даёт 0, и резерв не добавляется.</p><p class="small" style="color:#cfdfd4">Нужно закрепить адрес одного общего параметра перед копированием.</p></div><div class="panel"><h3>Выберите устойчивую формулу</h3><div class="choice" id="errorChoices"><button data-error="0" class="formula">=$D$2*(1+H2)</button><button data-error="1" class="formula">=D2*(1+$H$2)</button><button data-error="2" class="formula">=D$2*(1+$H2)</button></div><div class="feedback" id="errorFeedback" aria-live="polite"></div><p class="small muted">Для копирования только вниз H$2 тоже закрепит строку. $H$2 сохранит ячейку и при копировании вправо.</p></div></div>'},
{title:'Проверка перед практикой',group:'theory',minutes:2,render:()=>head('11 · Проверьте себя','Объясните без компьютера','Ответьте, затем сверьте рассуждение с соседом.')+'<div class="triple"><div class="panel"><h3>1. Диапазон</h3><p>Сколько ячеек входит в B2:D4?</p>'+chk('exit1','9','Три столбца и три строки.','3 × 3 = 9 ячеек.')+'</div><div class="panel"><h3>2. Копирование</h3><p>Ссылка $C4: на 2 столбца вправо и 1 строку вниз.</p>'+chk('exit2','$C5','Столбец C закреплён; строка изменяется.','$C4 превращается в $C5.','Новая ссылка')+'</div><div class="panel"><h3>3. Среднее</h3><p>Среднее пяти чисел равно 8. Чему равна их сумма?</p>'+chk('exit3','40','Среднее умножаем на количество чисел.','8 × 5 = 40.')+'</div></div>'},

{title:'Практика 1. Стоимость и резерв',group:'practice',minutes:7,render:()=>head('Практика 1 · 7 минут · лист «Расходы»','Рассчитайте бюджет поездки','В исходной книге заполнены количество, цена и резерв. Формулы внесите самостоятельно.')+'<div class="grid"><div class="panel stack">'+step(1,'В D2 введите =B2*C2. Нажмите Enter.','В D2 должно получиться 3000.')+step(2,'Выделите D2 и протяните маркер в правом нижнем углу до D6.','В D6 проверьте формулу: =B6*C6.')+step(3,'В E2 введите =D2*(1+$H$2). Протяните до E6.','В H2 находится резерв 10%.')+step(4,'В D8 найдите сумму D2:D6, в E8 — сумму E2:E6.','В D9/E9 вычислите среднее, в D10/E10 — максимум.')+'</div><div class="panel"><div class="tasktitle">Контроль результата</div><div class="answergrid"><label>D8: общий бюджет<input id="p1a" type="text" placeholder="₽"></label><label>E8: с резервом<input id="p1b" type="text" placeholder="₽"></label></div><button class="primary spaced" id="budgetCheck">Сверить результаты</button><div class="feedback" id="budgetFeedback" aria-live="polite"></div><button id="budgetHint">Нужна формула для итогов</button><div id="budgetHelp" class="hint"></div><p class="small muted spaced">Проверьте пересчёт: временно измените H2 на 20%. Итог E8 должен стать 21 360. Верните 10%.</p><label class="mcheck"><input type="checkbox" data-done="budget">Формулы внесены и пересчёт проверен</label></div></div>'},
{title:'Практика 2. Смешанные ссылки',group:'practice',minutes:6,render:()=>head('Практика 2 · 6 минут · лист «Ссылки»','Проверьте прогноз в настоящем Excel','В D3 уже стоит формула =$B3+C$2. Копируйте ячейку через Ctrl+C → Ctrl+V.')+'<div class="grid wide"><div>'+grid(copyData,{compact:true,selected:'D3'})+'<p class="small muted spaced">Копируйте исходную D3 отдельно в каждую ячейку. Вырезание и ввод готового числа не проверяют правило копирования.</p></div><div class="panel stack">'+step(1,'Запишите прогноз для E2: новая формула и результат.')+step(2,'Скопируйте D3 в E2 и сравните.')+step(3,'Скопируйте исходную D3 в C5. Проверьте строку формул.')+chk('p2','30','От D3 до C5: −1 столбец, +2 строки. $B3 → $B5; C$2 → B$2.','В C5: =$B5+B$2 = 18 + 12 = 30. В E2 получается 52.','Значение C5')+'<label class="mcheck"><input type="checkbox" data-done="references">Оба прогноза проверены в Excel</label></div></div>'},
{title:'Практика 3. Сумма по среднему',group:'practice',minutes:6,render:()=>head('Практика 3 · 6 минут · лист «Среднее»','Проверьте прямую и обратную задачи','A1:D1 содержат 6, 7, 5 и 10. В B4:B6 записаны условия обратной задачи.')+'<div class="grid"><div class="panel stack">'+step(1,'В B3 вычислите среднее диапазона A1:D1.','Используйте функцию СРЗНАЧ.')+step(2,'В B7 найдите сумму первых трёх чисел через известное среднее.','B4 — среднее 7; B5 — последнее число 10; B6 — количество 4.')+step(3,'В B8 вычислите сумму A1:C1 напрямую.','Результаты B7 и B8 должны совпасть.')+step(4,'Объясните, почему из одного среднего нельзя восстановить каждое число.','Приведите другую тройку с той же суммой.')+'</div><div class="panel soft"><h3>Самопроверка</h3>'+chk('p3','18','Общая сумма = среднее × количество. Затем вычтите последнее число.','B7: =B4*B6-B5 → 18. B8: =СУММ(A1:C1) → 18.','Значение B7')+'<p class="small muted spaced">Опыт: временно сделайте A1 пустой. Среднее A1:D1 станет 22/3 ≈ 7,33. Затем введите 0: среднее станет 5,5. Верните 6.</p><label class="mcheck"><input type="checkbox" data-done="average">Сравнил пустую ячейку и ноль</label></div></div>'},
{title:'Практика 4. Где результат 16?',group:'practice',minutes:5,render:()=>head('Практика 4 · 5 минут · лист «Цель»','Найдите адрес по значению','Исходная формула =B$3+$C2 находится в D2. Искомое значение после копирования — 16.')+'<div class="grid"><div class="panel stack">'+step(1,'Скопируйте D2 в диапазон E1:E4.','Ctrl+C на D2 → выделите E1:E4 → Ctrl+V.')+step(2,'Проверьте все четыре формулы в строке формул.','Первое слагаемое в каждой формуле — C$3.')+step(3,'Найдите ячейку со значением 16 и укажите номер её строки.','Объясните, почему получилось именно это значение.')+'</div><div class="panel">'+box('E1 = C$3+$C1<br>E2 = C$3+$C2<br>E3 = C$3+$C3<br>E4 = C$3+$C4')+chk('p4','3','C3 = 8. Для суммы 16 второй член тоже должен быть 8.','E1:E4 дают 14, 15, 16, 17. Значение 16 находится в E3; ответ — 3.','Номер строки')+'<label class="mcheck"><input type="checkbox" data-done="destination">Проверил четыре формулы</label></div></div>'},
{title:'Практика 5. Восстановите диаграмму',group:'practice',minutes:5,render:()=>head('Практика 5 · 5 минут · лист «Диаграмма»','Три сектора — одна подсказка','Добейтесь, чтобы круговая диаграмма A2:C2 состояла из трёх равных секторов.')+'<div class="grid"><div class="panel stack">'+step(1,'В A2 введите =2*(A1-C1). В B2 — =(A1+B1)/3.','A1 = 8, B1 = 4; C1 первоначально равно 3.')+step(2,'В C2 введите =C1-2. Выделите A2:C2.','Вставка → Круговая диаграмма. Выберите обычную двумерную.')+step(3,'Подберите целое C1 от 2 до 8. Включите подписи значений.','Найдите точное число вычислением, затем проверьте диаграмму.')+'</div><div class="panel soft"><h3>Сначала вычисление</h3>'+box('B2 = (8+4)/3 = 4<br>C2 = C1−2 = 4')+chk('p5','6','Из C1 − 2 = 4 найдите C1. Затем проверьте A2.','C1 = 6. A2 = 2 × (8 − 6) = 4, B2 = 4, C2 = 4.','Значение C1')+'<p class="small muted spaced">Диапазон диаграммы — A2:C2. Не включайте A1:C1: это исходные данные, а не результаты.</p><label class="mcheck"><input type="checkbox" data-done="chart">Диаграмма построена и связана с ячейками</label></div></div>'},
{title:'Практика 6. Разные единицы',group:'practice',minutes:5,render:()=>head('Практика 6 · 5 минут · лист «Выручка»','Переведите все данные в рубли','Выручка B2:B5 дана в тысячах рублей. Расходы в D2 — 105 000 рублей.')+'<div class="grid"><div class="panel stack">'+step(1,'В E4 найдите всю выручку в рублях.','Сначала сумма B2:B5, затем умножение на 1000.')+step(2,'В E5 вычислите результат после вычета расходов.','Используйте E4 и D2, чтобы не повторять расчёт выручки.')+step(3,'Проверьте модель изменением D2 на 110 000.','E5 должно стать 65 000. Верните расходы 105 000.')+'<p class="small muted">В ответе нужны рубли: число 70 здесь не подходит.</p></div><div class="panel"><h3>Проверьте E5</h3>'+chk('p6','70000','E4: =СУММ(B2:B5)*1000. Затем E5: =E4-D2.','Выручка 175 000 ₽; результат 175 000 − 105 000 = 70 000 ₽.','Результат в рублях')+'<label class="mcheck"><input type="checkbox" data-done="units">Проверил единицы и изменение расходов</label></div></div>'},
{title:'Сдача практики',group:'practice',minutes:3,render:()=>head('Завершение · 3 минуты','Покажите работу формул','Сохраните книгу и ответьте учителю: какую ссылку вы закрепили и зачем?')+'<div class="grid"><div class="panel"><h3>Критерии · 10 баллов</h3><table class="rubric"><tr><td>Стоимость, резерв, итоги и пересчёт</td><td>3</td></tr><tr><td>Копирование в E2 и C5</td><td>2</td></tr><tr><td>Сумма через среднее</td><td>1</td></tr><tr><td>Поиск ячейки E3</td><td>1</td></tr><tr><td>Три равных сектора, связь с данными</td><td>2</td></tr><tr><td>Результат в рублях</td><td>1</td></tr></table><p class="small muted spaced">8–10 — «5», 6–7 — «4», 4–5 — «3», 0–3 — доработка. Учитель может изменить шкалу.</p></div><div class="panel soft stack"><h3>Перед сдачей</h3><p>1. В расчётных ячейках стоят формулы.<br>2. Исходные данные восстановлены.<br>3. Диаграмма обновляется при изменении C1.<br>4. Файл сохранён под фамилией.</p><div id="doneSummary" class="codebox">Отмечено этапов: 0 из 6</div><button class="primary" id="exportReport">Скачать лист самопроверки</button><p class="small muted">Лист самопроверки содержит введённые на сайте ответы. Книга Excel проверяется учителем отдельно.</p><button data-go="22">Дополнительная тренировка →</button></div></div>'},
{title:'Дополнительно. Родственные связи',group:'bonus',minutes:0,render:()=>head('Дополнительный блок · первые две ссылки','Две таблицы — одно расследование','В таблице «Люди» хранятся пол и ID. В «Связях» каждая строка означает: родитель → ребёнок.')+'<div class="grid"><div class="panel"><h3>Кто родная сестра Дениса, ID 107?</h3><div class="family" id="familyCards">'+[[103,'Павел','Отец Дениса'],[106,'Мария','Мать Дениса'],[107,'Денис','Искомая семья'],[108,'Анна','103 → 108; 106 → 108'],[109,'Елена','103 → 109; 110 → 109'],[105,'Олег','Брат Павла']].map(([id,n,d])=>'<button class="person" data-person="'+id+'"><b>'+id+' · '+n+'</b><small>'+d+'</small></button>').join('')+'</div><div class="feedback" id="familyFeedback" aria-live="polite"></div><p class="small muted">В этих задачах «родные» — два общих родителя. Одного общего родителя недостаточно.</p></div><div class="panel soft stack"><h3>Алгоритм в Excel</h3>'+step(1,'На листе «Связи» отфильтруйте ребёнка 107.','Получите родителей 103 и 106.')+step(2,'Найдите детей каждого родителя.','Оставьте пересечение двух списков, исключите 107.')+step(3,'По таблице «Люди» оставьте женщин.','Фамилия сама по себе родство не доказывает.')+'<button data-go="21">Найти дядю →</button></div></div>'},
{title:'Дополнительно. Поиск дяди',group:'bonus',minutes:0,render:()=>head('Дополнительный блок · листы «Люди» и «Связи»','Кто дядя Дениса по отцовской линии?','В рамках задачи ищем родного брата отца; супругов тётей не учитываем.')+'<div class="grid"><div class="panel stack">'+step(1,'Отец Дениса — Павел, ID 103.','Его родители — 101 и 102.')+step(2,'Найдите общих детей 101 и 102.','Это 103, 104 и 105.')+step(3,'Исключите отца Дениса и оставьте мужчину.','Пол проверяйте по таблице «Люди».')+chk('uncle','105','Ирина, ID 104, — женщина. Павел, ID 103, — сам отец.','Дядя — Олег, ID 105: у него и Павла одни родители 101 и 102.','ID дяди')+'</div><div class="panel soft"><h3>Как включить фильтр</h3><p>Выделите таблицу вместе с заголовками → <b>Данные → Фильтр</b>.<br><br>Раскройте стрелку нужного столбца и оставьте один ID.</p><p class="spaced">Перед новым поиском очистите предыдущий фильтр.</p><p class="small muted spaced">Дополнительные задачи можно дать сильным ученикам или на следующий урок. Данные вымышлены; выводы делаем только по записанным связям.</p></div></div>'},
{title:'Тренажёр',group:'trainer',minutes:0,render:()=>head('Самостоятельная тренировка','Сначала прогноз — потом проверка','Задания можно решать в любом порядке. Подсказка раскрывает один следующий шаг.')+'<div class="grid"><div class="panel stack"><div class="row between"><span id="quizCounter" class="tag"></span><select id="quizSelect" style="width:330px" aria-label="Выбор задания"></select></div><h3 id="quizTitle"></h3><p id="quizText"></p><div id="quizExtra"></div><div class="row"><button id="quizPrev">←</button><button id="quizNext">Следующее задание →</button></div></div><div class="panel soft"><h3>Ваш ответ</h3><input id="quizAnswer" type="text" autocomplete="off" aria-label="Ответ в тренажёре" placeholder="Введите ответ"><div class="row spaced"><button id="quizCheck" class="primary">Проверить</button><button id="quizHint">Подсказка</button></div><div id="quizFeedback" class="feedback" aria-live="polite"></div><div id="quizHintText" class="hint"></div><div class="answerreport"><span id="quizScore"></span><button id="quizExport">Скачать результаты</button></div><p class="small muted spaced">Проверка принимает пробелы в числах и десятичную запятую. В формулах используйте латинские буквы.</p></div></div>'},
